
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zyntarix | Autonomous Software Engine</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Monaco Editor Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>

  <style>
    body { background-color: #0b0f17; color: #cbd5e1; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .custom-scroll::-webkit-scrollbar { width: 5px; height: 5px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    .custom-scroll::-webkit-scrollbar-thumb:hover { background: #475569; }
  </style>
</head>
<body class="h-screen flex flex-col overflow-hidden select-none">

  <!-- Header Section -->
  <header class="h-12 bg-[#0f172a] border-b border-[#1e293b] flex items-center justify-between px-4 z-10">
    <div class="flex items-center space-x-3">
      <div class="flex items-center gap-2 font-bold text-sm text-lime-400 tracking-wide">
        <i data-lucide="terminal" class="w-4 h-4"></i> zyntarix.
      </div>
      <span class="text-xs text-slate-500 hidden sm:inline">• 99.99% Self-Healing Pipeline</span>
    </div>

    <!-- Agent Prompt Input -->
    <div class="flex-1 max-w-xl mx-4 flex items-center gap-2">
      <input id="promptInput" type="text" 
             value="Create a real-time chat application with Node.js and Socket.io"
             placeholder="Describe what you want to build..." 
             class="w-full bg-[#0b0f17] border border-[#334155] rounded-md px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-lime-400 font-mono">
      <button id="launchBtn" class="flex items-center gap-1.5 bg-[#a3e635] hover:bg-[#84cc16] text-[#0f172a] font-bold px-3 py-1.5 rounded-md text-xs transition">
        <i data-lucide="play" class="w-3.5 h-3.5 fill-current"></i> Launch Pipeline
      </button>
    </div>

    <div class="flex items-center gap-2">
      <button id="runPreviewBtn" class="flex items-center gap-1 bg-cyan-600 hover:bg-cyan-500 text-white px-2.5 py-1.5 rounded-md text-xs font-medium transition">
        <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i> Run
      </button>
    </div>
  </header>

  <!-- 3-Column IDE Workspace -->
  <main class="flex-1 flex overflow-hidden">
    
    <!-- Col 1: File Explorer -->
    <aside class="w-52 bg-[#0b0f17] border-r border-[#1e293b] flex flex-col">
      <div class="px-3 py-2 text-[11px] font-semibold text-slate-400 uppercase tracking-wider flex items-center justify-between border-b border-[#1e293b]">
        <span>Workspace Files</span>
        <i data-lucide="files" class="w-3.5 h-3.5"></i>
      </div>
      <div id="fileList" class="flex-1 overflow-y-auto custom-scroll p-2 text-xs space-y-1"></div>
    </aside>

    <!-- Col 2: Monaco Editor -->
    <section class="flex-1 flex flex-col border-r border-[#1e293b] bg-[#1e1e1e]">
      <div class="h-9 bg-[#0f172a] border-b border-[#1e293b] flex items-center px-3 justify-between">
        <div class="flex items-center gap-2 text-xs text-slate-300">
          <i data-lucide="file-code" class="w-3.5 h-3.5 text-cyan-400"></i>
          <span id="currentFileName" class="font-mono">index.html</span>
        </div>
        <span class="text-[10px] text-slate-500 font-mono">VS Code Engine</span>
      </div>
      <div id="editorContainer" class="flex-1 w-full"></div>
    </section>

    <!-- Col 3: Live Preview & Agent Console -->
    <aside class="w-[450px] bg-[#0b0f17] flex flex-col">
      
      <!-- Top: Live Browser Preview -->
      <div class="flex-1 flex flex-col border-b border-[#1e293b]">
        <div class="h-9 bg-[#0f172a] px-3 flex items-center justify-between text-xs border-b border-[#1e293b]">
          <span class="text-slate-400 flex items-center gap-1.5 font-medium">
            <i data-lucide="globe" class="w-3.5 h-3.5 text-cyan-400"></i> Live App Preview
          </span>
          <button id="reloadPreviewBtn" class="hover:text-white text-slate-400">
            <i data-lucide="rotate-cw" class="w-3.5 h-3.5"></i>
          </button>
        </div>
        <div class="flex-1 bg-white relative">
          <iframe id="appFrame" class="w-full h-full border-none" sandbox="allow-scripts allow-modals"></iframe>
        </div>
      </div>

      <!-- Bottom: Execution Stream Console -->
      <div class="h-64 flex flex-col bg-[#050811]">
        <div class="h-8 bg-[#0f172a] px-3 flex items-center justify-between text-[11px] font-semibold text-slate-400 border-b border-[#1e293b]">
          <div class="flex items-center gap-2">
            <div class="flex space-x-1">
              <span class="w-2.5 h-2.5 rounded-full bg-red-500 inline-block"></span>
              <span class="w-2.5 h-2.5 rounded-full bg-yellow-500 inline-block"></span>
              <span class="w-2.5 h-2.5 rounded-full bg-green-500 inline-block"></span>
            </div>
            <span>Agent Execution Stream</span>
          </div>
          <span id="streamStatus" class="text-cyan-400 font-mono text-[10px]">Connected</span>
        </div>
        <div id="consoleLogs" class="flex-1 p-3 overflow-y-auto custom-scroll font-mono text-[11px] space-y-2">
          <div class="p-2 rounded bg-[#0f172a] border border-[#1e293b] text-slate-400">
            > Ready for pipeline dispatch...
          </div>
        </div>
      </div>

    </aside>
  </main>

  <script>
    lucide.createIcons();

    // Virtual In-Memory Files
    const files = {
      'index.html': {
        lang: 'html',
        code: `<!DOCTYPE html>\n<html>\n<head>\n  <style>\n    body { font-family: sans-serif; background: #0f172a; color: #f8fafc; text-align: center; padding-top: 50px; }\n    .box { display: inline-block; padding: 20px; border-radius: 8px; background: #1e293b; border: 1px solid #334155; }\n  </style>\n</head>\n<body>\n  <div class="box">\n    <h2>⚡ Zyntarix Sandbox</h2>\n    <p>Your generated live UI will appear here.</p>\n  </div>\n</body>\n</html>`
      },
      'styles.css': {
        lang: 'css',
        code: `/* Custom UI Styles */\n* { box-sizing: border-box; }`
      },
      'server.js': {
        lang: 'javascript',
        code: `// Express Runtime Container\nconst express = require('express');\nconst app = express();\n\napp.listen(3000);`
      }
    };

    let activeFile = 'index.html';
    let monacoEditor = null;

    // Load Monaco Editor
    require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs' } });
    require(['vs/editor/editor.main'], function () {
      monacoEditor = monaco.editor.create(document.getElementById('editorContainer'), {
        value: files[activeFile].code,
        language: files[activeFile].lang,
        theme: 'vs-dark',
        automaticLayout: true,
        fontSize: 13,
        minimap: { enabled: false },
        lineNumbers: 'on',
        scrollBeyondLastLine: false,
        fontFamily: 'Consolas, "Courier New", monospace'
      });

      monacoEditor.onDidChangeModelContent(() => {
        files[activeFile].code = monacoEditor.getValue();
      });

      refreshPreview();
    });

    // Render Explorer Tree
    function renderFileExplorer() {
      const list = document.getElementById('fileList');
      list.innerHTML = '';
      Object.keys(files).forEach(f => {
        const item = document.createElement('div');
        const isActive = f === activeFile;
        item.className = `flex items-center gap-2 px-2.5 py-1.5 rounded cursor-pointer transition font-mono ${
          isActive ? 'bg-[#1e293b] text-lime-400 font-semibold' : 'text-slate-400 hover:bg-[#0f172a] hover:text-white'
        }`;
        item.innerHTML = `<i data-lucide="file" class="w-3.5 h-3.5"></i><span>${f}</span>`;
        item.onclick = () => switchFile(f);
        list.appendChild(item);
      });
      lucide.createIcons();
    }

    // Switch File in Editor
    function switchFile(f) {
      if (!monacoEditor) return;
      files[activeFile].code = monacoEditor.getValue();
      activeFile = f;
      document.getElementById('currentFileName').textContent = f;
      monaco.editor.setModelLanguage(monacoEditor.getModel(), files[f].lang);
      monacoEditor.setValue(files[f].code);
      renderFileExplorer();
    }

    // Render HTML in preview iframe
    function refreshPreview() {
      const frame = document.getElementById('appFrame');
      const doc = frame.contentDocument || frame.contentWindow.document;
      doc.open();
      let html = files['index.html'] ? files['index.html'].code : '';
      if (files['styles.css']) {
        html += `<style>${files['styles.css'].code}</style>`;
      }
      doc.write(html);
      doc.close();
    }

    // Add Cards into Terminal (Matching the original styling)
    function addConsoleCard(title, role, message, isFinished = false) {
      const consoleBox = document.getElementById('consoleLogs');
      const time = new Date().toLocaleTimeString();
      const card = document.createElement('div');
      card.className = "p-2 rounded bg-[#0b101b] border border-[#1e293b] space-y-1";
      
      const roleColor = role.includes('Architect') ? 'text-lime-400' : (role.includes('Coder') ? 'text-cyan-400' : 'text-yellow-400');
      
      card.innerHTML = `
        <div class="flex items-center justify-between text-[10px]">
          <span class="text-slate-400 font-mono">[${time}] <strong class="${roleColor}">[${role}]</strong></span>
          <span class="text-slate-500 uppercase tracking-wider">${title}</span>
        </div>
        <p class="text-slate-300 text-[11px] font-mono leading-relaxed">${message}</p>
      `;
      consoleBox.appendChild(card);
      consoleBox.scrollTop = consoleBox.scrollHeight;

      if (isFinished) {
        document.getElementById('streamStatus').textContent = 'Finished';
        document.getElementById('streamStatus').className = 'text-emerald-400 font-mono text-[10px]';
      }
    }

    // Connect to Server SSE
    const sse = new EventSource('/stream-terminal');
    sse.onmessage = (event) => {
      const msg = event.data;
      if (msg.includes('Architect')) {
        addConsoleCard('Planning', 'Architect Agent', msg.replace(/\[.*?\]/g, '').trim());
      } else if (msg.includes('Coder')) {
        addConsoleCard('Writing Code', 'Coder Agent', msg.replace(/\[.*?\]/g, '').trim());
      } else if (msg.includes('Auditor')) {
        addConsoleCard('Passed', 'Auditor Agent', msg.replace(/\[.*?\]/g, '').trim(), true);
      } else {
        const line = document.createElement('div');
        line.className = 'text-slate-400';
        line.textContent = `> ${msg}`;
        document.getElementById('consoleLogs').appendChild(line);
      }
    };

    // Pipeline Trigger
    document.getElementById('launchBtn').addEventListener('click', async () => {
      const prompt = document.getElementById('promptInput').value.trim();
      if (!prompt) return;

      document.getElementById('streamStatus').textContent = 'Streaming...';
      document.getElementById('streamStatus').className = 'text-yellow-400 font-mono text-[10px]';
      addConsoleCard('Initiating', 'System', `Initiating multi-agent orchestration for prompt: "${prompt}"`);

      try {
        const res = await fetch('/generate-code', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt, currentCode: files['index.html'].code })
        });
        const data = await res.json();
        if (data.code) {
          files['index.html'].code = data.code;
          if (activeFile === 'index.html' && monacoEditor) {
            monacoEditor.setValue(data.code);
          }
          refreshPreview();
          addConsoleCard('Finished', 'System', 'Build successful! Artifacts ready for deployment.', true);
        }
      } catch (err) {
        addConsoleCard('Error', 'System', `Execution failed: ${err.message}`);
      }
    });

    document.getElementById('runPreviewBtn').addEventListener('click', refreshPreview);
    document.getElementById('reloadPreviewBtn').addEventListener('click', refreshPreview);

    renderFileExplorer();
  </script>
</body>
</html>
